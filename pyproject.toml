[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-task-manager"
version = "0.1.0"
description = "Lightweight local task manager with Linear-like browser UI and Claude Code MCP integration"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "mcp>=1.5.0",
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.scripts]
task-manager = "task_manager.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/task_manager"]
